<!-- Icône Manhwadle : fenêtre système ORV (coins en équerre) et étoile du Star Stream, fond transparent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a9c4f0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a9c4f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Coins en équerre de la fenêtre système -->
  <g stroke="#a9c4f0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M118 182 V146 Q118 118 146 118 H182"/>
    <path d="M394 330 V366 Q394 394 366 394 H330"/>
  </g>
  <!-- Étoile à quatre branches -->
  <circle cx="256" cy="256" r="96" fill="url(#glow)"/>
  <path fill="#e8eefa" d="M256 168 C264 228 284 248 344 256 C284 264 264 284 256 344 C248 284 228 264 168 256 C228 248 248 228 256 168 Z"/>
</svg>
