# API de Manhwadle : connexion Discord, parties du jour vérifiées, série et classement.
name = "manhwadle-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://kureo524.github.io/Manhwadle/"
DISCORD_CLIENT_ID = "1567602819027181668"
# DISCORD_CLIENT_SECRET : secret, via `npx wrangler secret put DISCORD_CLIENT_SECRET`
# DAILY_SECRET : secret du perso du jour, via `npx wrangler secret put DAILY_SECRET`

[[d1_databases]]
binding = "DB"
database_name = "manhwadle"
database_id = "f3554e5a-2c95-4e57-94f9-7c604b02fa56"
migrations_dir = "migrations"

# Limites de débit par adresse IP (par emplacement Cloudflare, approximatives). Périodes possibles : 10 ou 60 s.
[[ratelimits]]
name = "LIMIT_AUTH"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_POLL"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMIT_API"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

# Purge quotidienne des sessions et des demandes de connexion expirées.
[triggers]
crons = ["0 4 * * *"]

# Images d'indice du perso du jour (tools/hints.mjs) : jamais servies directement, le Worker passe toujours d'abord.
[assets]
directory = "./hints"
binding = "ASSETS"
run_worker_first = true
